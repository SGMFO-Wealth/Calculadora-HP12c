name: Limpar Release antiga (uso único)

# Dispara apenas quando este arquivo é enviado ao repositório. Remove a Release v1.0.1 e a tag.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-release.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Apagar Release v1.0.1 e a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.0.1 --cleanup-tag --yes --repo "${{ github.repository }}" || echo "v1.0.1 já não existe"
